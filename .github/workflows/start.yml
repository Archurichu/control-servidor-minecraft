name: Start Minecraft Server

on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: ubuntu-latest

    steps:

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENCIALES }}

    - name: Start Azure VM
      run: |
        az vm start \
        --resource-group Pruebas \
        --name serverarchurichuminecraftmv
