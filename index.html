<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor Minecraft</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            color: white;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p  { color: #aaa; margin-bottom: 40px; }
        .buttons { display: flex; gap: 20px; }
        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        #btn-start { background-color: #4CAF50; color: white; }
        #btn-stop  { background-color: #f44336; color: white; }
        #status {
            margin-top: 30px;
            font-size: 1.1rem;
            padding: 12px 24px;
            border-radius: 8px;
            background-color: #16213e;
        }
    </style>
</head>
<body>
    <h1>🎮 Servidor Minecraft</h1>
    <p>Controla tu servidor desde aquí</p>

    <div class="buttons">
        <button id="btn-start" onclick="controlVM('start')">▶️ Encender</button>
        <button id="btn-stop"  onclick="controlVM('stop')">⏹️ Apagar</button>
    </div>

    <div id="status">Esperando acción...</div>

    <script>
        const FUNCTION_URL = "https://encenderserverminecraft.azurewebsites.net/api/control_vm?code=q0S9XtraM9RMxvf2IFO654Bp4vMh1HwBODjWHauE_YOAAzFuzr8S0Q==";
        const clave   = "#minecraft5653326bfs82b2611bs"; // ← cambia esto por la clave que pusiste en Variables de entorno

        async function controlVM(action) {
            const status = document.getElementById("status");
            status.textContent = "⏳ Procesando...";

            try {
                const res = await fetch(`${FUNCTION_URL}&action=${action}`, {
                    headers: { "x-api-key": clave }
                });
                const msg = await res.text();
                status.textContent = msg;
            } catch (err) {
                status.textContent = "❌ Error: " + err.message;
            }
        }
    </script>
</body>
</html>
