<!DOCTYPE html>
<html>
<head>
<title>Servidor Minecraft</title>
<style>
body{
font-family:Arial;
text-align:center;
background:#1e1e1e;
color:white;
}

button{
padding:15px;
font-size:18px;
background:#4CAF50;
border:none;
color:white;
cursor:pointer;
}

button:hover{
background:#45a049;
}
</style>
</head>

<body>

<h1>Servidor Minecraft</h1>

<p id="estado">Comprobando estado...</p>

<button onclick="encender()">Encender Servidor</button>

<script>

async function estado(){

const ip="TU_IP_PUBLICA";

const res = await fetch(
"https://api.mcsrvstat.us/bedrock/2/"+ip+":19132"
);

const data = await res.json();

if(data.online){
document.getElementById("estado").innerText="🟢 Servidor ONLINE";
}else{
document.getElementById("estado").innerText="🔴 Servidor OFFLINE";
}

}

async function encender(){

alert("Iniciando servidor... puede tardar 40 segundos");

fetch("https://api.github.com/repos/TU_USUARIO/TU_REPO/actions/workflows/start.yml/dispatches",{
method:"POST",
headers:{
"Accept":"application/vnd.github+json",
"Authorization":"Bearer TU_TOKEN"
},
body:JSON.stringify({
ref:"main"
})
});

}

estado();

</script>

</body>
</html>
